[package]
name = "gakri-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "성적 계산 · 임포트 · 암호화 · 접근 제어. GUI 프레임워크에 의존하지 않는다."

[lib]
name = "gakri_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 과목 요소(수행·중간·기말)는 선언 순서를 지켜야 한다. 부동소수점 덧셈은 결합법칙이
# 성립하지 않아서, 순서가 바뀌면 반올림 경계에서 총점이 0.1 어긋난다.
indexmap = { version = "2", features = ["serde"] }

# 엑셀 읽기. SheetJS(Node) 대체 — 사이드카 없이 순수 Rust.
calamine = "0.26"

# 로컬 저장 암호화. DB 없이 파일 하나를 AEAD 로 봉인한다.
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = "1"
# aes-gcm 0.10 이 쓰는 것과 같은 major. OS CSPRNG (salt / DEK / 세션 토큰).
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"

thiserror = "1"
